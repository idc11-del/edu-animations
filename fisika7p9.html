<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Наблюдение Броуновского движения</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }

        /* Надёжное центрирование без искажений */
        .player-wrapper {
            text-align: center;
            margin: 20px 0;
        }
        .player-wrapper object,
        .player-wrapper embed,
        .player-wrapper iframe {
            display: inline-block;
            margin: 0 auto;
            max-width: 100%;
            width: 800px;
            height: 600px;
        }

        p, li {
            line-height: 1.6;
        }
        ul {
            list-style-type: decimal;
            padding-left: 24px;
        }
        .italic-text {
            font-style: italic;
            text-align: right;
        }
        .instructions {
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #2c3e50;
            margin: 20px 0;
        }
        
        /* Блок с вопросами */
        .questions-block {
            background: #e8f4fd;
            border: 1px solid #b3d7ff;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .questions-block h4 {
            margin-top: 0;
            color: #1c4a7a;
        }
        
        /* Блок «типичная ошибка» */
        .common-error {
            background: #fff3e0;
            border: 1px solid #ffcc80;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .common-error h4 {
            margin-top: 0;
            color: #d35f1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Наблюдение за Броуновским движением частичек черной туши в молоке с помощью виртуального микроскопа</h1>

    
        <div class="player-wrapper">
            <object type="application/x-shockwave-flash" data="fisika7p9.swf" width="800" height="600">
                <param name="movie" value="fisika7p9.swf">
            </object>
        </div>

        <!-- Ruffle подключаем после плеера -->
        <script src="https://unpkg.com/@ruffle-rs/ruffle/ruffle.js"></script>

   

       
        
        <hr>

        <nav>
            <a href="https://сомит.рф/index.html">← На главную</a>
        </nav>

        <footer>
            <div class="italic-text">
                <hr>
                © 2024–2026 сомит.рф
            </div>
        </footer>
    </div>
</body>
</html>
